[package]
name = "abms-desktop"
version = "1.0.0"
description = "ABMS 데스크톱 앱"
edition = "2021"

[lib]
name = "abms_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSEvent"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
