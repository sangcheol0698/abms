spring:
  application:
    name: abms
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/abms}
    username: ${DB_USERNAME:abms}
    password: ${DB_PASSWORD:abms}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        default_batch_fetch_size: 100
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      # 첨부 파일 한도는 20MB (AttachmentService), 요청 한도는 여유를 둔다.
      max-file-size: 25MB
      max-request-size: 30MB
  docker:
    compose:
      enabled: false
  threads:
    virtual:
      enabled: true
  ai:
    model:
      chat: openai
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      api-key: ${OPENAI_API_KEY:not-configured}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4.1-mini}
          temperature: 0.2

server:
  servlet:
    session:
      timeout: 8h
  error:
    whitelabel:
      enabled: false

gg:
  jte:
    use-precompiled-templates: true

abms:
  ai:
    api-key: ${OPENAI_API_KEY:}
  storage:
    # 첨부 파일 저장 위치 (로컬 디스크)
    path: ${ABMS_STORAGE_PATH:./data/attachments}
  map:
    kakao-js-key: ${KAKAO_JS_KEY:}
    kakao-rest-key: ${KAKAO_REST_KEY:}
  attachment:
    # 삭제한 첨부는 보관 기간이 지나면 매일 새벽 파일 본문까지 지운다.
    cleanup-enabled: true
    cleanup-cron: "0 30 3 * * *"
    retention-days: 30
  reminder:
    # 매일 아침 청구일 임박·기한 경과·종료 임박 알림
    enabled: true
    cron: "0 30 8 * * *"
  summary:
    schedule-enabled: true
    cron: "0 0 3 * * *"
  bootstrap:
    admin-email: ${ABMS_ADMIN_EMAIL:}
    admin-password: ${ABMS_ADMIN_PASSWORD:}
  demo:
    calculate-on-startup: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: local
    # 로컬 비밀값(.env, git 제외)을 환경 변수처럼 읽는다. 예: KAKAO_JS_KEY, KAKAO_REST_KEY
    import: optional:file:.env[.properties]
  docker:
    compose:
      enabled: true
      lifecycle-management: start-only
  flyway:
    locations: classpath:db/migration,classpath:db/demo
    # 데모 데이터(V100+) 이후에 추가된 스키마 마이그레이션(V3+)도 기존 로컬 DB에 적용한다.
    out-of-order: true

gg:
  jte:
    use-precompiled-templates: false
    development-mode: true

abms:
  demo:
    calculate-on-startup: true

logging:
  level:
    kr.co.abacus.abms: debug

---
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/demo
    # 데모 데이터(V100+) 이후에 추가된 스키마 마이그레이션(V3+)도 기존 로컬 DB에 적용한다.
    out-of-order: true

abms:
  demo:
    calculate-on-startup: true
